<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VOID — إعدادات الموقع</title>


    <style>

        /* =====================================================
           الأساس
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;

            scrollbar-width: none;
        }


        html::-webkit-scrollbar {
            width: 0;
            height: 0;

            display: none;
        }


        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(90, 0, 0, 0.10),
                    transparent 40%
                ),
                #050505;

            color: #e8e8e8;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            overflow-x: hidden;

            scrollbar-width: none;

            transition:
                background .35s ease,
                color .35s ease;
        }


        body::-webkit-scrollbar {
            width: 0;
            height: 0;

            display: none;
        }


        /* =====================================================
           القائمة الجانبية
        ===================================================== */

        .sidebar {
            position: fixed;

            top: 0;
            right: 0;

            width: 285px;
            height: 100vh;

            display: flex;

            flex-direction: column;

            padding:
                55px
                30px
                30px;

            background:
                linear-gradient(
                    180deg,
                    #090909 0%,
                    #060606 100%
                );

            border-left:
                1px solid #260000;

            z-index: 1000;

            transition:
                background .35s ease,
                border-color .35s ease;
        }


        /* =====================================================
           الشعار
        ===================================================== */

        .logo {
            color: #eeeeee;

            font-size: 27px;

            font-weight: 300;

            letter-spacing: .25em;

            text-align: right;

            padding-right: 4px;
        }


        .logo span {
            color: #720000;

            text-shadow:
                0 0 14px rgba(130, 0, 0, .35);
        }


        .sidebar-divider {
            width: 100%;

            height: 1px;

            margin:
                28px 0
                35px;

            background:
                linear-gradient(
                    to left,
                    #650000,
                    rgba(101, 0, 0, 0)
                );
        }


        /* =====================================================
           التنقل
        ===================================================== */

        .navigation {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .nav-item {
            position: relative;

            min-height: 58px;

            display: flex;

            align-items: center;

            gap: 17px;

            padding: 0 17px;

            color: #777;

            text-decoration: none;

            border-right:
                1px solid transparent;

            transition:
                color .35s ease,
                background .35s ease,
                transform .35s ease;
        }


        .nav-item::before {
            content: "";

            position: absolute;

            right: -1px;

            top: 50%;

            width: 2px;

            height: 0;

            background:
                #760000;

            transform:
                translateY(-50%);

            transition:
                height .35s ease;
        }


        .nav-item:hover,
        .nav-item.active {
            color: #eeeeee;

            background:
                linear-gradient(
                    to left,
                    rgba(100, 0, 0, .16),
                    rgba(100, 0, 0, 0)
                );
        }


        .nav-item:hover::before,
        .nav-item.active::before {
            height: 70%;
        }


        .nav-item:hover {
            transform:
                translateX(-4px);
        }


        .nav-number {
            color: #4d4d4d;

            font-family: monospace;

            font-size: 11px;
        }


        .nav-item:hover .nav-number,
        .nav-item.active .nav-number {
            color: #700000;
        }


        /* =====================================================
           أسفل القائمة
        ===================================================== */

        .sidebar-bottom {
            margin-top: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                18px 5px 0;

            border-top:
                1px solid #171717;

            color: #3d3d3d;

            font-size: 10px;

            letter-spacing: .2em;
        }


        .sidebar-status {
            width: 6px;

            height: 6px;

            border-radius: 50%;

            background:
                #650000;

            box-shadow:
                0 0 8px rgba(120, 0, 0, .7);
        }


        /* =====================================================
           أزرار الهاتف
        ===================================================== */

        .mobile-menu-button,
        .mobile-close-button,
        .mobile-menu-overlay {
            display: none;
        }


        /* =====================================================
           محتوى الإعدادات
        ===================================================== */

        .settings-wrapper {
            width:
                calc(100% - 285px);

            min-height: 100vh;

            margin-right:
                285px;

            padding:
                50px 7vw 80px;
        }


        .settings-page {
            width: 100%;

            max-width: 900px;

            margin: 0 auto;
        }


        /* =====================================================
           رأس الصفحة
        ===================================================== */

        .page-header {
            text-align: center;

            margin-bottom: 55px;
        }


        .page-label {
            display: block;

            color: #650000;

            font-size: 11px;

            letter-spacing: .35em;

            margin-bottom: 15px;
        }


        .page-title {
            color: #eeeeee;

            font-size:
                clamp(38px, 7vw, 68px);

            font-weight: 200;

            letter-spacing: .08em;
        }


        .page-line {
            width: 100px;

            height: 1px;

            margin:
                24px auto 0;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    #720000,
                    transparent
                );
        }


        /* =====================================================
           بطاقات الإعدادات
        ===================================================== */

        .settings-card {
            position: relative;

            padding:
                28px;

            margin-bottom:
                16px;

            border:
                1px solid #1d1d1d;

            background:
                linear-gradient(
                    135deg,
                    rgba(90, 0, 0, .07),
                    rgba(255,255,255,.012)
                );
        }


        .settings-card-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 24px;

            padding-bottom:
                18px;

            border-bottom:
                1px solid #171717;
        }


        .settings-card-title {
            color: #dddddd;

            font-size: 18px;

            font-weight: 400;
        }


        .settings-card-number {
            color: #650000;

            font-family: monospace;

            font-size: 11px;

            letter-spacing: .12em;
        }


        .settings-description {
            color: #666;

            font-size: 13px;

            line-height: 2;

            margin-bottom:
                20px;
        }


        /* =====================================================
           الخيارات
        ===================================================== */

        .option-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;
        }


        .option-button {
            position: relative;

            min-height: 74px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding:
                0 20px;

            border:
                1px solid #222;

            background:
                rgba(255,255,255,.012);

            color: #888;

            cursor: pointer;

            font-family: inherit;

            transition:
                color .25s ease,
                border-color .25s ease,
                background .25s ease,
                transform .25s ease;
        }


        .option-button:hover {
            color: #eeeeee;

            border-color:
                #500000;

            background:
                rgba(90,0,0,.08);

            transform:
                translateY(-2px);
        }


        .option-button.active {
            color: #eeeeee;

            border-color:
                #750000;

            background:
                linear-gradient(
                    135deg,
                    rgba(110,0,0,.16),
                    rgba(255,255,255,.012)
                );
        }


        .option-button.active::before {
            content: "";

            position: absolute;

            right: 0;

            top: 0;
            bottom: 0;

            width: 2px;

            background:
                #760000;
        }


        .option-main {
            display: flex;

            flex-direction: column;

            align-items: flex-start;

            gap: 5px;
        }


        .option-title {
            font-size: 14px;
        }


        .option-example {
            color: #555;

            font-size: 11px;
        }


        .option-mark {
            width: 9px;

            height: 9px;

            border-radius: 50%;

            border:
                1px solid #3b3b3b;

            transition:
                background .25s ease,
                border-color .25s ease,
                box-shadow .25s ease;
        }


        .option-button.active .option-mark {
            background:
                #720000;

            border-color:
                #8a0000;

            box-shadow:
                0 0 8px rgba(120,0,0,.45);
        }


        /* =====================================================
           الوضع الفاتح
        ===================================================== */

        body.light-mode {
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(120, 0, 0, 0.06),
                    transparent 40%
                ),
                #eeeeee;

            color:
                #202020;
        }


        body.light-mode .sidebar {
            background:
                linear-gradient(
                    180deg,
                    #f1f1f1 0%,
                    #e8e8e8 100%
                );

            border-left:
                1px solid #d2baba;
        }


        body.light-mode .logo {
            color:
                #202020;
        }


        body.light-mode .sidebar-divider {
            background:
                linear-gradient(
                    to left,
                    #900000,
                    rgba(144,0,0,0)
                );
        }


        body.light-mode .nav-item {
            color:
                #777;
        }


        body.light-mode .nav-item:hover,
        body.light-mode .nav-item.active {
            color:
                #202020;

            background:
                linear-gradient(
                    to left,
                    rgba(120,0,0,.07),
                    transparent
                );
        }


        body.light-mode .sidebar-bottom {
            border-top:
                1px solid #d7d7d7;

            color:
                #777;
        }


        body.light-mode .page-title,
        body.light-mode .settings-card-title {
            color:
                #202020;
        }


        body.light-mode .settings-card {
            border-color:
                #d8d8d8;

            background:
                rgba(255,255,255,.7);
        }


        body.light-mode .settings-card-header {
            border-bottom:
                1px solid #dddddd;
        }


        body.light-mode .option-button {
            border-color:
                #d3d3d3;

            background:
                rgba(255,255,255,.7);

            color:
                #666;
        }


        body.light-mode .option-button.active {
            color:
                #202020;

            border-color:
                #800000;

            background:
                rgba(110,0,0,.05);
        }


        /* =====================================================
           العودة
        ===================================================== */

        .back-button {
            display: flex;

            align-items: center;

            justify-content: center;

            width: fit-content;

            min-height: 50px;

            padding:
                0 28px;

            margin:
                40px auto 0;

            border:
                1px solid #2d2d2d;

            color: #999;

            text-decoration: none;

            font-size: 13px;

            background:
                rgba(255,255,255,.01);

            transition:
                color .3s ease,
                border-color .3s ease,
                background .3s ease,
                transform .3s ease;
        }


        .back-button:hover {
            color: #eeeeee;

            border-color:
                #650000;

            background:
                rgba(90,0,0,.10);

            transform:
                translateY(-2px);
        }


        body.light-mode .back-button {
            border-color:
                #cfcfcf;

            color:
                #666;

            background:
                rgba(255,255,255,.65);
        }


        body.light-mode .back-button:hover {
            color:
                #222;

            border-color:
                #800000;

            background:
                rgba(120,0,0,.06);
        }


        /* =====================================================
           الهاتف
        ===================================================== */

        @media (max-width: 800px) {

            html {
                overflow-x: hidden;
            }


            body {
                overflow-x: hidden;
            }


            .sidebar {
                top: 0;

                right: 0;

                left: auto;

                width:
                    min(82vw, 300px);

                height: 100vh;

                padding:
                    35px 25px 25px;

                border-left:
                    1px solid #260000;

                border-right: 0;

                transform:
                    translate3d(
                        100%,
                        0,
                        0
                    );

                z-index: 220;

                will-change:
                    transform;

                transition:
                    transform .35s
                    cubic-bezier(
                        .22,
                        .61,
                        .36,
                        1
                    );
            }


            .sidebar.mobile-open {
                transform:
                    translate3d(
                        0,
                        0,
                        0
                    );
            }


            .mobile-menu-overlay {
                position: fixed;

                inset: 0;

                display: block;

                background:
                    rgba(0,0,0,.55);

                opacity: 0;

                visibility: hidden;

                pointer-events: none;

                z-index: 210;

                transition:
                    opacity .25s ease;
            }


            .mobile-menu-overlay.show {
                opacity: 1;

                visibility: visible;

                pointer-events: auto;
            }


            .mobile-menu-button {
                position: fixed;

                top: 18px;

                right: 18px;

                width: 46px;

                height: 46px;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: center;

                gap: 5px;

                padding: 0;

                border:
                    1px solid #4f0000;

                border-radius: 2px;

                background:
                    rgba(5,5,5,.96);

                cursor: pointer;

                z-index: 250;
            }


            .mobile-menu-button span {
                display: block;

                width: 23px;

                height: 2px;

                border-radius: 1px;

                background:
                    #d4d4d4;
            }


            .mobile-menu-button.hidden {
                opacity: 0;

                visibility: hidden;

                pointer-events: none;
            }


            .mobile-close-button {
                position: absolute;

                top: 17px;

                right: 17px;

                width: 44px;

                height: 44px;

                display: flex;

                align-items: center;

                justify-content: center;

                padding: 0;

                border:
                    1px solid #5b0000;

                border-radius: 3px;

                background:
                    linear-gradient(
                        145deg,
                        rgba(105,0,0,.2),
                        rgba(255,255,255,.025)
                    );

                color:
                    #d2d2d2;

                font-size:
                    24px;

                cursor: pointer;

                z-index: 5;
            }


            .logo {
                margin-top: 40px;
            }


            .navigation {
                flex-direction: column;

                gap: 8px;
            }


            .nav-item {
                width: 100%;

                min-height: 56px;

                justify-content: flex-start;
            }


            .sidebar-bottom {
                margin-top: auto;
            }


            /* =============================================
               محتوى الإعدادات
            ============================================== */

            .settings-wrapper {
                width: 100%;

                min-height: 100vh;

                margin-right: 0;

                padding:
                    30px 14px 60px;
            }


            .settings-page {
                max-width:
                    100%;
            }


            .page-header {
                margin-bottom:
                    35px;
            }


            .settings-card {
                padding:
                    22px 18px;
            }


            .settings-card-title {
                font-size:
                    17px;
            }


            .settings-description {
                font-size:
                    12px;
            }


            .option-grid {
                grid-template-columns:
                    1fr;
            }


            .option-button {
                min-height:
                    68px;
            }


            .back-button {
                width: 100%;
            }

        }


        /* =====================================================
           الهاتف الصغير
        ===================================================== */

        @media (max-width: 450px) {

            .mobile-menu-button {
                top: 14px;

                right: 14px;

                width: 43px;

                height: 43px;
            }


            .mobile-close-button {
                top: 14px;

                right: 14px;

                width: 41px;

                height: 41px;
            }


            .settings-wrapper {
                padding:
                    25px 12px 55px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         طبقة الهاتف
    ====================================================== -->

    <div
        class="mobile-menu-overlay"
        id="mobile-menu-overlay"
    ></div>


    <!-- =====================================================
         زر القائمة — الهاتف
    ====================================================== -->

    <button
        class="mobile-menu-button"
        id="mobile-menu-button"
        type="button"
        aria-label="فتح القائمة"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- =====================================================
         القائمة الجانبية
    ====================================================== -->

    <aside class="sidebar">


        <button
            class="mobile-close-button"
            id="mobile-close-button"
            type="button"
            aria-label="إغلاق القائمة"
        >
            →
        </button>


        <div class="logo">
            <span>V</span>OID
        </div>


        <div class="sidebar-divider"></div>


        <nav class="navigation">


            <a
                href="../"
                class="nav-item"
            >

                <span class="nav-number">
                    01
                </span>

                <span>
                    الرئيسية
                </span>

            </a>


            <a
                href="../chapters/"
                class="nav-item"
            >

                <span class="nav-number">
                    02
                </span>

                <span>
                    الفصول
                </span>

            </a>


            <a
                href="#"
                class="nav-item"
            >

                <span class="nav-number">
                    03
                </span>

                <span>
                    عالم الرواية
                </span>

            </a>


            <a
                href="./"
                class="nav-item active"
            >

                <span class="nav-number">
                    04
                </span>

                <span>
                    إعدادات الموقع
                </span>

            </a>


        </nav>


        <div class="sidebar-bottom">

            <span>
                VOID
            </span>

            <span class="sidebar-status"></span>

        </div>


    </aside>


    <!-- =====================================================
         محتوى الإعدادات
    ====================================================== -->

    <div class="settings-wrapper">


        <main class="settings-page">


            <!-- =================================================
                 الرأس
            ================================================== -->

            <header class="page-header">

                <span class="page-label">
                    VOID
                </span>


                <h1 class="page-title">
                    إعدادات الموقع
                </h1>


                <div class="page-line"></div>

            </header>


            <!-- =================================================
                 الوضع
            ================================================== -->

            <section class="settings-card">


                <div class="settings-card-header">

                    <h2 class="settings-card-title">
                        وضع الموقع
                    </h2>


                    <span class="settings-card-number">
                        01
                    </span>

                </div>


                <p class="settings-description">
                    اختر المظهر الذي يناسبك. سيتم حفظ اختيارك على هذا الجهاز.
                </p>


                <div class="option-grid">


                    <button
                        type="button"
                        class="option-button"
                        data-theme="dark"
                    >

                        <span class="option-main">

                            <span class="option-title">
                                الوضع الداكن
                            </span>

                            <span class="option-example">
                                المظهر الأساسي لـ VOID
                            </span>

                        </span>


                        <span class="option-mark"></span>

                    </button>


                    <button
                        type="button"
                        class="option-button"
                        data-theme="light"
                    >

                        <span class="option-main">

                            <span class="option-title">
                                الوضع الفاتح
                            </span>

                            <span class="option-example">
                                مظهر فاتح وهادئ
                            </span>

                        </span>


                        <span class="option-mark"></span>

                    </button>


                </div>


            </section>


            <!-- =================================================
                 نوع الخط
            ================================================== -->

            <section class="settings-card">


                <div class="settings-card-header">

                    <h2 class="settings-card-title">
                        نوع الخط
                    </h2>


                    <span class="settings-card-number">
                        02
                    </span>

                </div>


                <p class="settings-description">
                    اختر نوع الخط المستخدم في واجهة إعدادات الموقع.
                </p>


                <div class="option-grid">


                    <button
                        type="button"
                        class="option-button"
                        data-font="segoe"
                    >

                        <span class="option-main">

                            <span class="option-title">
                                Segoe UI
                            </span>

                            <span class="option-example">
                                VOID — الرواية
                            </span>

                        </span>


                        <span class="option-mark"></span>

                    </button>


                    <button
                        type="button"
                        class="option-button"
                        data-font="tahoma"
                    >

                        <span class="option-main">

                            <span class="option-title">
                                Tahoma
                            </span>

                            <span class="option-example">
                                VOID — الرواية
                            </span>

                        </span>


                        <span class="option-mark"></span>

                    </button>


                    <button
                        type="button"
                        class="option-button"
                        data-font="arial"
                    >

                        <span class="option-main">

                            <span class="option-title">
                                Arial
                            </span>

                            <span class="option-example">
                                VOID — الرواية
                            </span>

                        </span>


                        <span class="option-mark"></span>

                    </button>


                    <button
                        type="button"
                        class="option-button"
                        data-font="serif"
                    >

                        <span class="option-main">

                            <span class="option-title">
                                Georgia
                            </span>

                            <span class="option-example">
                                VOID — الرواية
                            </span>

                        </span>


                        <span class="option-mark"></span>

                    </button>


                </div>


            </section>


            <!-- =================================================
                 العودة
            ================================================== -->

            <a
                href="../"
                class="back-button"
            >
                العودة إلى الرئيسية
            </a>


        </main>


    </div>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script>


        /* =================================================
           القائمة الهاتف
        ================================================= */

        const mobileMenuButton =
            document.getElementById(
                "mobile-menu-button"
            );


        const mobileCloseButton =
            document.getElementById(
                "mobile-close-button"
            );


        const mobileMenuOverlay =
            document.getElementById(
                "mobile-menu-overlay"
            );


        const sidebar =
            document.querySelector(
                ".sidebar"
            );


        function openMobileMenu() {

            sidebar.classList.add(
                "mobile-open"
            );

            mobileMenuButton.classList.add(
                "hidden"
            );

            mobileMenuOverlay.classList.add(
                "show"
            );

        }


        function closeMobileMenu() {

            sidebar.classList.remove(
                "mobile-open"
            );

            mobileMenuButton.classList.remove(
                "hidden"
            );

            mobileMenuOverlay.classList.remove(
                "show"
            );

        }


        mobileMenuButton.addEventListener(
            "click",
            openMobileMenu
        );


        mobileCloseButton.addEventListener(
            "click",
            closeMobileMenu
        );


        mobileMenuOverlay.addEventListener(
            "click",
            closeMobileMenu
        );


        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Escape" &&
                    sidebar.classList.contains(
                        "mobile-open"
                    )
                ) {

                    closeMobileMenu();

                }

            }
        );


        /* =================================================
           الوضع الداكن / الفاتح
        ================================================== */

        const themeButtons =
            document.querySelectorAll(
                "[data-theme]"
            );


        const savedTheme =
            localStorage.getItem(
                "voidSiteTheme"
            ) || "dark";


        function applyTheme(
            theme,
            save = true
        ) {

            document.body.classList.toggle(
                "light-mode",
                theme === "light"
            );


            themeButtons.forEach(
                (button) => {

                    button.classList.toggle(
                        "active",
                        button.dataset.theme ===
                            theme
                    );

                }
            );


            if (save) {

                localStorage.setItem(
                    "voidSiteTheme",
                    theme
                );

            }

        }


        themeButtons.forEach(
            (button) => {

                button.addEventListener(
                    "click",
                    () => {

                        applyTheme(
                            button.dataset.theme
                        );

                    }
                );

            }
        );


        applyTheme(
            savedTheme,
            false
        );


        /* =================================================
           نوع الخط
        ================================================== */

        const fontButtons =
            document.querySelectorAll(
                "[data-font]"
            );


        const savedFont =
            localStorage.getItem(
                "voidSettingsFont"
            ) || "segoe";


        function applyFont(
            font,
            save = true
        ) {

            const fontMap = {

                segoe:
                    '"Segoe UI", Tahoma, Arial, sans-serif',

                tahoma:
                    'Tahoma, Arial, sans-serif',

                arial:
                    'Arial, sans-serif',

                serif:
                    'Georgia, "Times New Roman", serif'

            };


            document.body.style.fontFamily =
                fontMap[font] ||
                fontMap.segoe;


            fontButtons.forEach(
                (button) => {

                    button.classList.toggle(
                        "active",
                        button.dataset.font ===
                            font
                    );

                }
            );


            if (save) {

                localStorage.setItem(
                    "voidSettingsFont",
                    font
                );

            }

        }


        fontButtons.forEach(
            (button) => {

                button.addEventListener(
                    "click",
                    () => {

                        applyFont(
                            button.dataset.font
                        );

                    }
                );

            }
        );


        applyFont(
            savedFont,
            false
        );


    </script>


</body>
</html>
