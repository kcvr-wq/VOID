```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VOID — الفصل الأول</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center top,
                    rgba(90, 0, 0, 0.08),
                    transparent 35%
                ),
                #050505;

            color: #e8e8e8;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
        }


        /* =================================================
           الصفحة
        ================================================== */

        .chapter-page {
            width: 100%;

            min-height: 100vh;

            padding:
                60px 25px 100px;
        }


        .chapter-container {
            width: 100%;

            max-width: 900px;

            margin: 0 auto;
        }


        /* =================================================
           الرأس
        ================================================== */

        .chapter-header {
            text-align: center;

            padding-bottom: 35px;

            border-bottom:
                1px solid #1c1c1c;
        }


        .chapter-label {
            display: block;

            margin-bottom: 15px;

            color: #680000;

            font-size: 11px;

            letter-spacing: .25em;
        }


        .chapter-title {
            color: #eeeeee;

            font-size:
                clamp(32px, 6vw, 55px);

            font-weight: 300;

            letter-spacing: .08em;
        }


        .chapter-line {
            width: 90px;

            height: 1px;

            margin: 25px auto 0;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    #700000,
                    transparent
                );
        }


        /* =================================================
           محتوى الفصل
        ================================================== */

        .chapter-content {
            padding:
                80px 0;
        }


        .empty-chapter {
            min-height: 300px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            border:
                1px solid #181818;

            background:
                linear-gradient(
                    135deg,
                    rgba(90, 0, 0, .06),
                    rgba(255, 255, 255, .012)
                );

            padding: 50px 25px;
        }


        .empty-symbol {
            color:
                rgba(110, 0, 0, .25);

            font-size: 40px;

            letter-spacing: .2em;

            margin-bottom: 20px;
        }


        .empty-chapter h2 {
            color: #dedede;

            font-size: 22px;

            font-weight: 400;
        }


        .empty-chapter p {
            margin-top: 12px;

            color: #666;

            font-size: 14px;

            line-height: 2;
        }


        /* =================================================
           العودة
        ================================================== */

        .chapter-navigation {
            display: flex;

            justify-content: center;

            padding-top: 30px;

            border-top:
                1px solid #161616;
        }


        .back-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 50px;

            padding:
                0 28px;

            color: #eeeeee;

            background:
                #570000;

            border:
                1px solid #690000;

            text-decoration: none;

            font-size: 13px;

            transition:
                background .3s ease,
                transform .3s ease,
                border-color .3s ease;
        }


        .back-button:hover {
            background: #760000;

            border-color: #850000;

            transform:
                translateY(-2px);
        }


        /* =================================================
           الهاتف
        ================================================== */

        @media (max-width: 600px) {

            .chapter-page {
                padding:
                    35px 15px 70px;
            }


            .chapter-content {
                padding:
                    50px 0;
            }


            .empty-chapter {
                min-height: 260px;

                padding:
                    40px 20px;
            }


            .empty-symbol {
                font-size: 32px;
            }


            .empty-chapter h2 {
                font-size: 19px;
            }


            .empty-chapter p {
                font-size: 13px;
            }


            .back-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <main class="chapter-page">

        <div class="chapter-container">


            <!-- =================================================
                 رأس الفصل
            ================================================== -->

            <header class="chapter-header">

                <span class="chapter-label">
                    الفصل الأول
                </span>

                <h1 class="chapter-title">
                    لا يوجد محتوى
                </h1>

                <div class="chapter-line"></div>

            </header>


            <!-- =================================================
                 محتوى الفصل
            ================================================== -->

            <section class="chapter-content">

                <div class="empty-chapter">

                    <span class="empty-symbol">
                        VOID
                    </span>

                    <h2>
                        لا يوجد محتوى للفصل حاليًا
                    </h2>

                    <p>
                        سيتم إضافة محتوى الفصل الأول لاحقًا.
                    </p>

                </div>

            </section>


            <!-- =================================================
                 العودة للرئيسية
            ================================================== -->

            <nav class="chapter-navigation">

                <a
                    href="../../"
                    class="back-button"
                >
                    العودة إلى الرئيسية
                </a>

            </nav>


        </div>

    </main>

</body>

</html>
```
