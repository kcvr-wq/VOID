<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VOID — الفصول</title>


    <!-- خط Amiri -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           الأساس
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;

            scrollbar-width: none;
        }


        html::-webkit-scrollbar {
            width: 0;
            height: 0;

            display: none;
        }


        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(90, 0, 0, 0.10),
                    transparent 40%
                ),
                #050505;

            color: #e8e8e8;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            overflow-x: hidden;

            scrollbar-width: none;

            transition:
                background .35s ease,
                color .35s ease,
                font-family .25s ease;
        }


        body::-webkit-scrollbar {
            width: 0;
            height: 0;

            display: none;
        }


        /* =====================================================
           Amiri
        ===================================================== */

        body.site-font-amiri {
            font-family:
                "Amiri",
                serif;
        }


        body.site-font-amiri
        button,
        body.site-font-amiri
        a {
            font-family:
                "Amiri",
                serif;
        }


        /* =====================================================
           القائمة الجانبية
        ===================================================== */

        .sidebar {
            position: fixed;

            top: 0;
            right: 0;

            width: 285px;
            height: 100vh;

            display: flex;
            flex-direction: column;

            padding:
                55px
                30px
                30px;

            background:
                linear-gradient(
                    180deg,
                    #090909 0%,
                    #060606 100%
                );

            border-left:
                1px solid #260000;

            z-index: 1000;
        }


        .logo {
            color: #eeeeee;

            font-size: 27px;

            font-weight: 300;

            letter-spacing: .25em;

            text-align: right;

            padding-right: 4px;
        }


        .logo span {
            color: #720000;

            text-shadow:
                0 0 14px rgba(130, 0, 0, .35);
        }


        .sidebar-divider {
            width: 100%;

            height: 1px;

            margin:
                28px 0
                35px;

            background:
                linear-gradient(
                    to left,
                    #650000,
                    rgba(101, 0, 0, 0)
                );
        }


        .navigation {
            display: flex;
            flex-direction: column;

            gap: 8px;
        }


        .nav-item {
            position: relative;

            min-height: 58px;

            display: flex;

            align-items: center;

            gap: 17px;

            padding: 0 17px;

            color: #777;

            text-decoration: none;

            border-right:
                1px solid transparent;

            transition:
                color .35s ease,
                background .35s ease,
                transform .35s ease;
        }


        .nav-item::before {
            content: "";

            position: absolute;

            right: -1px;
            top: 50%;

            width: 2px;
            height: 0;

            background: #760000;

            transform:
                translateY(-50%);

            transition:
                height .35s ease;
        }


        .nav-item:hover,
        .nav-item.active {
            color: #eeeeee;

            background:
                linear-gradient(
                    to left,
                    rgba(100, 0, 0, .16),
                    rgba(100, 0, 0, 0)
                );
        }


        .nav-item:hover::before,
        .nav-item.active::before {
            height: 70%;
        }


        .nav-item:hover {
            transform:
                translateX(-4px);
        }


        .nav-number {
            color: #4d4d4d;

            font-family: monospace;

            font-size: 11px;
        }


        .nav-item:hover .nav-number,
        .nav-item.active .nav-number {
            color: #700000;
        }


        .sidebar-bottom {
            margin-top: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                18px 5px 0;

            border-top:
                1px solid #171717;

            color: #3d3d3d;

            font-size: 10px;

            letter-spacing: .2em;
        }


        .sidebar-status {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #650000;

            box-shadow:
                0 0 8px rgba(120,0,0,.7);
        }


        /* =====================================================
           الهاتف
        ===================================================== */

        .mobile-menu-button,
        .mobile-close-button,
        .mobile-menu-overlay {
            display: none;
        }


        /* =====================================================
           الصفحة
        ===================================================== */

        .chapters-wrapper {
            width:
                calc(100% - 285px);

            min-height: 100vh;

            margin-right:
                285px;

            padding:
                50px 7vw 80px;
        }


        .chapters-page {
            width: 100%;

            max-width: 1000px;

            margin: 0 auto;
        }


        .page-header {
            text-align: center;

            margin-bottom: 55px;
        }


        .page-label {
            display: block;

            color: #650000;

            font-size: 11px;

            letter-spacing: .35em;

            margin-bottom: 15px;
        }


        .page-title {
            color: #eeeeee;

            font-size:
                clamp(38px, 7vw, 68px);

            font-weight: 200;

            letter-spacing: .12em;
        }


        .page-line {
            width: 100px;

            height: 1px;

            margin: 24px auto 0;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    #720000,
                    transparent
                );
        }


        /* =====================================================
           المجلد
        ===================================================== */

        .volume {
            width: 100%;

            border:
                1px solid #1d1d1d;

            background:
                linear-gradient(
                    135deg,
                    rgba(90,0,0,.07),
                    rgba(255,255,255,.012)
                );

            overflow: hidden;
        }


        .volume-header {
            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding:
                24px 28px;

            background:
                linear-gradient(
                    to left,
                    rgba(110,0,0,.12),
                    transparent
                );

            border-bottom:
                1px solid #191919;

            cursor: pointer;

            user-select: none;

            transition:
                background .3s ease;
        }


        .volume-header:hover {
            background:
                linear-gradient(
                    to left,
                    rgba(110,0,0,.18),
                    transparent
                );
        }


        .volume-info {
            display: flex;

            align-items: center;

            gap: 18px;
        }


        .volume-number {
            color: #700000;

            font-family: monospace;

            font-size: 12px;

            letter-spacing: .15em;
        }


        .volume-title {
            color: #dddddd;

            font-size: 20px;

            font-weight: 400;
        }


        .volume-count {
            color: #555;

            font-size: 11px;

            margin-top: 4px;
        }


        .volume-arrow {
            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid #3b0000;

            color: #8a8a8a;

            font-size: 18px;

            transition:
                transform .35s ease,
                color .3s ease,
                border-color .3s ease,
                background .3s ease;
        }


        .volume-header:hover .volume-arrow {
            color: #eeeeee;

            border-color: #650000;

            background:
                rgba(100,0,0,.10);
        }


        .volume.open .volume-arrow {
            transform:
                rotate(180deg);

            color: #eeeeee;

            border-color: #650000;

            background:
                rgba(100,0,0,.10);
        }


        /* =====================================================
           قائمة الفصول
        ===================================================== */

        .chapters-list {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            padding: 18px;

            max-height: 0;

            opacity: 0;

            overflow: hidden;

            transition:
                max-height .5s ease,
                opacity .35s ease,
                padding .4s ease;
        }


        .volume.open .chapters-list {
            max-height: 5000px;

            opacity: 1;

            padding:
                20px;
        }


        /* =====================================================
           بطاقة الفصل
        ===================================================== */

        .chapter-item {
            position: relative;

            min-height: 70px;

            display: flex;

            align-items: center;

            gap: 17px;

            padding:
                0 18px;

            border:
                1px solid #1b1b1b;

            background:
                rgba(255,255,255,.012);

            text-decoration: none;

            color: #777;

            transition:
                color .3s ease,
                border-color .3s ease,
                background .3s ease,
                transform .3s ease;
        }


        .chapter-item::before {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;
            right: 0;

            width: 2px;

            background: #650000;

            transform:
                scaleY(0);

            transition:
                transform .3s ease;
        }


        .chapter-item:hover {
            color: #eeeeee;

            border-color:
                #350000;

            background:
                linear-gradient(
                    to left,
                    rgba(100,0,0,.10),
                    rgba(255,255,255,.012)
                );

            transform:
                translateX(-3px);
        }


        .chapter-item:hover::before {
            transform:
                scaleY(1);
        }


        .chapter-number {
            color: #650000;

            font-family: monospace;

            font-size: 12px;

            min-width: 28px;
        }


        .chapter-name {
            color: inherit;

            font-size: 14px;
        }


        .chapter-status {
            margin-right: auto;

            color: #3f3f3f;

            font-size: 10px;

            letter-spacing: .08em;

            white-space: nowrap;
        }


        .chapter-status.completed {
            color: #760000;

            font-size: 14px;

            font-weight: 600;
        }


        .chapter-item.completed {
            border-color:
                #260000;
        }


        .chapter-item.completed .chapter-number {
            color:
                #760000;
        }


        /* =====================================================
           الفصول غير المنشورة
        ===================================================== */

        .chapter-item.unavailable {
            cursor: default;

            opacity: .55;
        }


        .chapter-item.unavailable:hover {
            color: #777;

            border-color:
                #1b1b1b;

            background:
                rgba(255,255,255,.012);

            transform: none;
        }


        .chapter-item.unavailable:hover::before {
            transform:
                scaleY(0);
        }


        /* =====================================================
           العودة
        ===================================================== */

        .back-button {
            display: flex;

            align-items: center;

            justify-content: center;

            width: fit-content;

            min-height: 50px;

            padding:
                0 28px;

            margin:
                40px auto 0;

            border:
                1px solid #2d2d2d;

            color: #999;

            text-decoration: none;

            font-size: 13px;

            background:
                rgba(255,255,255,.01);

            transition:
                color .3s ease,
                border-color .3s ease,
                background .3s ease,
                transform .3s ease;
        }


        .back-button:hover {
            color: #eeeeee;

            border-color: #650000;

            background:
                rgba(90,0,0,.10);

            transform:
                translateY(-2px);
        }


        /* =====================================================
           الوضع الفاتح
        ===================================================== */

        body.light-mode {
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(120,0,0,.06),
                    transparent 40%
                ),
                #eeeeee;

            color:
                #202020;
        }


        body.light-mode .sidebar {
            background:
                linear-gradient(
                    180deg,
                    #f1f1f1 0%,
                    #e8e8e8 100%
                );

            border-left:
                1px solid #d2baba;
        }


        body.light-mode .logo,
        body.light-mode .page-title {
            color:
                #202020;
        }


        body.light-mode .nav-item:hover,
        body.light-mode .nav-item.active {
            color:
                #202020;

            background:
                linear-gradient(
                    to left,
                    rgba(120,0,0,.07),
                    transparent
                );
        }


        body.light-mode .sidebar-bottom {
            border-top:
                1px solid #d7d7d7;

            color:
                #777;
        }


        body.light-mode .volume {
            border-color:
                #d8d8d8;

            background:
                rgba(255,255,255,.7);
        }


        body.light-mode .volume-header {
            background:
                linear-gradient(
                    to left,
                    rgba(120,0,0,.05),
                    transparent
                );

            border-bottom:
                1px solid #dddddd;
        }


        body.light-mode .volume-title {
            color:
                #202020;
        }


        body.light-mode .chapter-item {
            border-color:
                #d3d3d3;

            background:
                rgba(255,255,255,.65);

            color:
                #666;
        }


        body.light-mode .chapter-item:hover {
            color:
                #202020;

            border-color:
                #800000;

            background:
                rgba(120,0,0,.05);
        }


        body.light-mode .chapter-status.completed {
            color:
                #800000;
        }


        body.light-mode .back-button {
            border-color:
                #cfcfcf;

            color:
                #666;

            background:
                rgba(255,255,255,.65);
        }


        /* =====================================================
           الهاتف
        ===================================================== */

        @media (max-width: 800px) {

            html {
                overflow-x: hidden;

                scrollbar-width: none;
            }


            body {
                overflow-x: hidden;

                scrollbar-width: none;
            }


            .sidebar {
                top: 0;

                right: 0;

                left: auto;

                width:
                    min(82vw, 300px);

                height: 100vh;

                padding:
                    35px 25px 25px;

                transform:
                    translate3d(
                        100%,
                        0,
                        0
                    );

                z-index: 220;

                will-change:
                    transform;

                transition:
                    transform .35s
                    cubic-bezier(
                        .22,
                        .61,
                        .36,
                        1
                    );
            }


            .sidebar.mobile-open {
                transform:
                    translate3d(
                        0,
                        0,
                        0
                    );
            }


            .mobile-menu-overlay {
                position: fixed;

                inset: 0;

                display: block;

                background:
                    rgba(0,0,0,.55);

                opacity: 0;

                visibility: hidden;

                pointer-events: none;

                z-index: 210;

                transition:
                    opacity .25s ease,
                    visibility .25s ease;
            }


            .mobile-menu-overlay.show {
                opacity: 1;

                visibility: visible;

                pointer-events: auto;
            }


            .mobile-menu-button {
                position: fixed;

                top: 18px;
                right: 18px;

                width: 46px;
                height: 46px;

                display: flex;

                flex-direction: column;

                align-items: center;
                justify-content: center;

                gap: 5px;

                padding: 0;

                border:
                    1px solid #4f0000;

                border-radius: 2px;

                background:
                    rgba(5,5,5,.96);

                cursor: pointer;

                z-index: 250;
            }


            .mobile-menu-button span {
                display: block;

                width: 23px;
                height: 2px;

                border-radius: 1px;

                background:
                    #d4d4d4;
            }


            .mobile-menu-button.hidden {
                opacity: 0;

                visibility: hidden;

                pointer-events: none;
            }


            .mobile-close-button {
                position: absolute;

                top: 17px;
                right: 17px;

                width: 44px;
                height: 44px;

                display: flex;

                align-items: center;
                justify-content: center;

                padding: 0;

                border:
                    1px solid #5b0000;

                border-radius: 3px;

                background:
                    linear-gradient(
                        145deg,
                        rgba(105,0,0,.2),
                        rgba(255,255,255,.025)
                    );

                color:
                    #d2d2d2;

                font-size:
                    24px;

                cursor:
                    pointer;

                z-index:
                    5;
            }


            .logo {
                margin-top:
                    40px;
            }


            .navigation {
                flex-direction:
                    column;

                gap:
                    8px;
            }


            .nav-item {
                width:
                    100%;

                min-height:
                    56px;

                justify-content:
                    flex-start;
            }


            .sidebar-bottom {
                margin-top:
                    auto;
            }


            .chapters-wrapper {
                width:
                    100%;

                min-height:
                    100vh;

                margin-right:
                    0;

                padding:
                    30px 14px 60px;
            }


            .chapters-page {
                max-width:
                    100%;
            }


            .page-header {
                margin-bottom:
                    35px;
            }


            .volume-header {
                padding:
                    20px 18px;
            }


            .volume-info {
                gap:
                    12px;
            }


            .volume-title {
                font-size:
                    17px;
            }


            .volume-count {
                font-size:
                    10px;
            }


            .chapters-list {
                grid-template-columns:
                    1fr;

                gap:
                    8px;
            }


            .volume.open .chapters-list {
                padding:
                    14px;
            }


            .chapter-item {
                min-height:
                    62px;

                padding:
                    0 15px;
            }


            .chapter-name {
                font-size:
                    13px;
            }


            .chapter-status {
                font-size:
                    10px;
            }


            .back-button {
                width:
                    100%;
            }

        }


        /* =====================================================
           الهاتف الصغير
        ===================================================== */

        @media (max-width: 450px) {

            .mobile-menu-button {
                top:
                    14px;

                right:
                    14px;

                width:
                    43px;

                height:
                    43px;
            }


            .mobile-close-button {
                top:
                    14px;

                right:
                    14px;

                width:
                    41px;

                height:
                    41px;
            }


            .chapters-wrapper {
                padding:
                    25px 12px 55px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         طبقة إغلاق الهاتف
    ====================================================== -->

    <div
        class="mobile-menu-overlay"
        id="mobile-menu-overlay"
    ></div>


    <!-- =====================================================
         زر القائمة
    ====================================================== -->

    <button
        class="mobile-menu-button"
        id="mobile-menu-button"
        type="button"
        aria-label="فتح القائمة"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- =====================================================
         القائمة
    ====================================================== -->

    <aside class="sidebar">


        <button
            class="mobile-close-button"
            id="mobile-close-button"
            type="button"
            aria-label="إغلاق القائمة"
        >
            →
        </button>


        <div class="logo">
            <span>V</span>OID
        </div>


        <div class="sidebar-divider"></div>


        <nav class="navigation">


            <a
                href="../"
                class="nav-item"
            >
                <span class="nav-number">
                    01
                </span>

                <span>
                    الرئيسية
                </span>
            </a>


            <a
                href="./"
                class="nav-item active"
            >
                <span class="nav-number">
                    02
                </span>

                <span>
                    الفصول
                </span>
            </a>


            <a
                href="#"
                class="nav-item empty-link"
            >
                <span class="nav-number">
                    03
                </span>

                <span>
                    عالم الرواية
                </span>
            </a>


            <a
                href="../settings/"
                class="nav-item"
            >
                <span class="nav-number">
                    04
                </span>

                <span>
                    إعدادات الموقع
                </span>
            </a>


        </nav>


        <div class="sidebar-bottom">

            <span>
                VOID
            </span>

            <span class="sidebar-status"></span>

        </div>


    </aside>


    <!-- =====================================================
         المحتوى
    ====================================================== -->

    <div class="chapters-wrapper">


        <main class="chapters-page">


            <header class="page-header">

                <span class="page-label">
                    VOID
                </span>


                <h1 class="page-title">
                    الفصول
                </h1>


                <div class="page-line"></div>

            </header>


            <section
                class="volume"
                id="volume-1"
            >


                <div
                    class="volume-header"
                    id="volume-header"
                >


                    <div class="volume-info">

                        <div class="volume-number">
                            01
                        </div>


                        <div>

                            <h2 class="volume-title">
                                المجلد الأول
                            </h2>


                            <div class="volume-count">
                                50 فصلًا
                            </div>

                        </div>

                    </div>


                    <div class="volume-arrow">
                        ↓
                    </div>


                </div>


                <div
                    class="chapters-list"
                    id="chapters-list"
                ></div>


            </section>


            <a
                href="../"
                class="back-button"
            >
                العودة إلى الرئيسية
            </a>


        </main>


    </div>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script>

        /* =================================================
           الإعدادات العامة
        ================================================= */

        const MAX_CHAPTERS =
            50;


        /*
           آخر فصل منشور حاليًا.
           غيّره من 1 إلى 2 عند إضافة الفصل الثاني.
        */

        const LATEST_PUBLISHED_CHAPTER =
            1;


        const chapterNames = {

            1: "الفصل الأول",
            2: "الفصل الثاني",
            3: "الفصل الثالث",
            4: "الفصل الرابع",
            5: "الفصل الخامس",
            6: "الفصل السادس",
            7: "الفصل السابع",
            8: "الفصل الثامن",
            9: "الفصل التاسع",
            10: "الفصل العاشر",
            11: "الفصل الحادي عشر",
            12: "الفصل الثاني عشر",
            13: "الفصل الثالث عشر",
            14: "الفصل الرابع عشر",
            15: "الفصل الخامس عشر",
            16: "الفصل السادس عشر",
            17: "الفصل السابع عشر",
            18: "الفصل الثامن عشر",
            19: "الفصل التاسع عشر",
            20: "الفصل العشرون",
            21: "الفصل الحادي والعشرون",
            22: "الفصل الثاني والعشرون",
            23: "الفصل الثالث والعشرون",
            24: "الفصل الرابع والعشرون",
            25: "الفصل الخامس والعشرون",
            26: "الفصل السادس والعشرون",
            27: "الفصل السابع والعشرون",
            28: "الفصل الثامن والعشرون",
            29: "الفصل التاسع والعشرون",
            30: "الفصل الثلاثون",
            31: "الفصل الحادي والثلاثون",
            32: "الفصل الثاني والثلاثون",
            33: "الفصل الثالث والثلاثون",
            34: "الفصل الرابع والثلاثون",
            35: "الفصل الخامس والثلاثون",
            36: "الفصل السادس والثلاثون",
            37: "الفصل السابع والثلاثون",
            38: "الفصل الثامن والثلاثون",
            39: "الفصل التاسع والثلاثون",
            40: "الفصل الأربعون",
            41: "الفصل الحادي والأربعون",
            42: "الفصل الثاني والأربعون",
            43: "الفصل الثالث والأربعون",
            44: "الفصل الرابع والأربعون",
            45: "الفصل الخامس والأربعون",
            46: "الفصل السادس والأربعون",
            47: "الفصل السابع والأربعون",
            48: "الفصل الثامن والأربعون",
            49: "الفصل التاسع والأربعون",
            50: "الفصل الخمسون"

        };


        /* =================================================
           إعدادات الموقع
        ================================================= */

        const savedTheme =
            localStorage.getItem(
                "voidSiteTheme"
            ) || "dark";


        const savedFont =
            localStorage.getItem(
                "voidSettingsFont"
            ) || "segoe";


        const fontMap = {

            segoe:
                '"Segoe UI", Tahoma, Arial, sans-serif',

            tahoma:
                'Tahoma, Arial, sans-serif',

            arial:
                'Arial, sans-serif',

            serif:
                'Georgia, "Times New Roman", serif',

            amiri:
                '"Amiri", serif'

        };


        document.body.classList.toggle(
            "light-mode",
            savedTheme === "light"
        );


        document.body.style.fontFamily =
            fontMap[savedFont] ||
            fontMap.segoe;


        document.body.classList.toggle(
            "site-font-amiri",
            savedFont === "amiri"
        );


        /* =================================================
           إنشاء 50 فصل
        ================================================= */

        const chaptersList =
            document.getElementById(
                "chapters-list"
            );


        let readingProgress =
            {};


        try {

            readingProgress =
                JSON.parse(
                    localStorage.getItem(
                        "voidReadingProgress"
                    )
                ) || {};

        } catch (error) {

            readingProgress =
                {};

        }


        for (
            let chapter = 1;
            chapter <= MAX_CHAPTERS;
            chapter++
        ) {

            const item =
                document.createElement(
                    "a"
                );


            item.className =
                "chapter-item";


            const isPublished =
                chapter <=
                LATEST_PUBLISHED_CHAPTER;


            const data =
                readingProgress[
                    chapter
                ];


            const completed =
                data &&
                data.completed === true;


            if (
                completed
            ) {

                item.classList.add(
                    "completed"
                );

            }


            if (
                !isPublished
            ) {

                item.classList.add(
                    "unavailable"
                );

                item.href =
                    "#";

            } else {

                item.href =
                    `chapter-${chapter}.html`;

            }


            const number =
                document.createElement(
                    "span"
                );


            number.className =
                "chapter-number";


            number.textContent =
                String(
                    chapter
                )
                .padStart(
                    2,
                    "0"
                );


            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "chapter-name";


            name.textContent =
                chapterNames[
                    chapter
                ] ||
                `الفصل ${chapter}`;


            const status =
                document.createElement(
                    "span"
                );


            status.className =
                "chapter-status";


            if (
                !isPublished
            ) {

                status.textContent =
                    "قريبًا";

            } else if (
                completed
            ) {

                status.textContent =
                    "✓";

                status.classList.add(
                    "completed"
                );

            } else {

                status.textContent =
                    "قراءة";

            }


            item.appendChild(
                number
            );


            item.appendChild(
                name
            );


            item.appendChild(
                status
            );


            chaptersList.appendChild(
                item
            );

        }


        /* =================================================
           منع الفصول غير المنشورة
        ================================================= */

        document
            .querySelectorAll(
                ".chapter-item.unavailable"
            )
            .forEach(
                (link) => {

                    link.addEventListener(
                        "click",
                        (event) => {

                            event.preventDefault();

                        }
                    );

                }
            );


        /* =================================================
           المجلد
        ================================================= */

        const volume =
            document.getElementById(
                "volume-1"
            );


        const volumeHeader =
            document.getElementById(
                "volume-header"
            );


        volumeHeader.addEventListener(
            "click",
            () => {

                volume.classList.toggle(
                    "open"
                );

            }
        );


        /* =================================================
           القائمة الهاتف
        ================================================= */

        const mobileMenuButton =
            document.getElementById(
                "mobile-menu-button"
            );


        const mobileCloseButton =
            document.getElementById(
                "mobile-close-button"
            );


        const mobileMenuOverlay =
            document.getElementById(
                "mobile-menu-overlay"
            );


        const sidebar =
            document.querySelector(
                ".sidebar"
            );


        function openMobileMenu() {

            sidebar.classList.add(
                "mobile-open"
            );


            mobileMenuButton.classList.add(
                "hidden"
            );


            mobileMenuOverlay.classList.add(
                "show"
            );

        }


        function closeMobileMenu() {

            sidebar.classList.remove(
                "mobile-open"
            );


            mobileMenuButton.classList.remove(
                "hidden"
            );


            mobileMenuOverlay.classList.remove(
                "show"
            );

        }


        mobileMenuButton.addEventListener(
            "click",
            openMobileMenu
        );


        mobileCloseButton.addEventListener(
            "click",
            closeMobileMenu
        );


        mobileMenuOverlay.addEventListener(
            "click",
            closeMobileMenu
        );


        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Escape" &&
                    sidebar.classList.contains(
                        "mobile-open"
                    )
                ) {

                    closeMobileMenu();

                }

            }
        );


        /* =================================================
           الروابط غير الجاهزة
        ================================================= */

        document
            .querySelectorAll(
                ".empty-link"
            )
            .forEach(
                (link) => {

                    link.addEventListener(
                        "click",
                        (event) => {

                            event.preventDefault();

                        }
                    );

                }
            );

    </script>


</body>
</html>
