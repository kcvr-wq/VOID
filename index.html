<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOID</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }


        /* =====================================================
           شاشة الافتتاح
        ===================================================== */

        #intro {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(100, 0, 0, 0.25),
                    rgba(10, 0, 0, 0.96) 45%,
                    #000000 100%
                );

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1.2s ease,
                visibility 1.2s ease;
        }


        /* =====================================================
           توهج الخلفية
        ===================================================== */

        .intro-glow {
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: rgba(120, 0, 0, 0.22);

            filter: blur(100px);

            animation: glowPulse 3s ease-in-out infinite alternate;
        }


        /* =====================================================
           محتوى الافتتاح
        ===================================================== */

        .intro-content {
            position: relative;
            z-index: 2;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            transform: scale(0.9);
            opacity: 0;

            animation: introAppear 1.8s ease forwards;
        }


        /* =====================================================
           الخطوط
        ===================================================== */

        .intro-line {
            width: 0;
            height: 1px;

            background: #8b0000;

            box-shadow:
                0 0 10px rgba(180, 0, 0, 0.7),
                0 0 25px rgba(180, 0, 0, 0.3);

            animation: lineExpand 1.5s ease forwards;
        }

        .intro-line:first-child {
            animation-delay: 0.4s;
        }

        .intro-line:nth-child(3) {
            animation-delay: 0.7s;
        }


        /* =====================================================
           عنوان VOID
        ===================================================== */

        .intro-content h1 {
            margin: 25px 0;

            font-size: clamp(60px, 12vw, 150px);

            font-weight: 500;
            letter-spacing: 18px;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(255, 0, 0, 0.2),
                0 0 35px rgba(120, 0, 0, 0.35);

            animation:
                titleReveal 2s ease forwards,
                titleGlow 3s ease-in-out infinite alternate 2s;
        }


        /* =====================================================
           النص
        ===================================================== */

        .intro-content p {
            margin-top: 25px;

            color: rgba(255, 255, 255, 0.55);

            font-size: 15px;

            letter-spacing: 3px;

            opacity: 0;

            animation: subtitleAppear 1.2s ease forwards;
            animation-delay: 1.2s;
        }


        /* =====================================================
           الموقع الرئيسي
        ===================================================== */

        #site {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 1.2s ease,
                visibility 1.2s ease;
        }


        #site.show {
            opacity: 1;
            visibility: visible;
        }


        /* =====================================================
           القائمة الجانبية
        ===================================================== */

        .sidebar {
            position: fixed;

            top: 0;
            right: 0;

            width: 285px;
            height: 100vh;

            display: flex;
            flex-direction: column;

            padding: 45px 30px;

            background:
                linear-gradient(
                    180deg,
                    #0a0a0a 0%,
                    #060606 100%
                );

            border-left: 1px solid rgba(120, 0, 0, 0.45);

            box-shadow:
                -15px 0 50px rgba(0, 0, 0, 0.5);

            transform: translateX(100%);

            transition:
                transform 1s cubic-bezier(.77,0,.18,1);

            transition-delay: 0.15s;
        }


        #site.show .sidebar {
            transform: translateX(0);
        }


        /* =====================================================
           الشعار
        ===================================================== */

        .logo {
            font-size: 30px;

            letter-spacing: 5px;

            font-weight: 600;

            color: #ffffff;
        }

        .logo span {
            color: #8b0000;

            text-shadow:
                0 0 15px rgba(180, 0, 0, 0.4);
        }


        /* =====================================================
           الفاصل
        ===================================================== */

        .sidebar-divider {
            width: 100%;
            height: 1px;

            margin: 30px 0;

            background:
                linear-gradient(
                    to left,
                    transparent,
                    rgba(150, 0, 0, 0.8),
                    transparent
                );
        }


        /* =====================================================
           القائمة
        ===================================================== */

        .navigation {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .nav-item {
            position: relative;

            display: flex;
            align-items: center;

            gap: 18px;

            padding: 18px 15px;

            color: rgba(255, 255, 255, 0.55);

            text-decoration: none;

            font-size: 16px;

            border-right: 2px solid transparent;

            transition:
                color 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease;
        }


        .nav-number {
            color: rgba(180, 0, 0, 0.75);

            font-size: 12px;

            letter-spacing: 2px;
        }


        .nav-item:hover {
            color: #ffffff;

            background: rgba(100, 0, 0, 0.08);

            border-right-color: #8b0000;
        }


        .nav-item.active {
            color: #ffffff;

            background: rgba(100, 0, 0, 0.14);

            border-right-color: #8b0000;
        }


        /* =====================================================
           أسفل القائمة
        ===================================================== */

        .sidebar-bottom {
            margin-top: auto;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding-top: 20px;

            color: rgba(255, 255, 255, 0.25);

            font-size: 11px;

            letter-spacing: 3px;
        }


        .sidebar-status {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #8b0000;

            box-shadow:
                0 0 10px rgba(180, 0, 0, 0.8);
        }


        /* =====================================================
           المحتوى الرئيسي
        ===================================================== */

        .main-content {
            position: absolute;

            top: 0;
            right: 285px;

            width: calc(100% - 285px);
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    rgba(100, 0, 0, 0.07),
                    transparent 55%
                );
        }


        /* =====================================================
           الرمز الخلفي
        ===================================================== */

        .background-symbol {
            position: absolute;

            font-size: min(65vw, 800px);

            font-weight: 900;

            color: rgba(120, 0, 0, 0.025);

            user-select: none;

            pointer-events: none;
        }


        /* =====================================================
           الترحيب
        ===================================================== */

        .welcome {
            position: relative;

            z-index: 2;

            text-align: center;

            opacity: 0;

            transform: translateY(25px);

            transition:
                opacity 1s ease,
                transform 1s ease;

            transition-delay: 0.7s;
        }


        #site.show .welcome {
            opacity: 1;
            transform: translateY(0);
        }


        .welcome-small {
            margin-bottom: 20px;

            color: rgba(255, 255, 255, 0.4);

            font-size: 13px;

            letter-spacing: 5px;
        }


        .welcome h2 {
            font-size: clamp(55px, 9vw, 120px);

            font-weight: 500;

            letter-spacing: 18px;

            color: #ffffff;

            text-shadow:
                0 0 30px rgba(100, 0, 0, 0.2);
        }


        .welcome-line {
            width: 80px;
            height: 1px;

            margin: 30px auto;

            background: #8b0000;

            box-shadow:
                0 0 15px rgba(180, 0, 0, 0.5);
        }


        .welcome p {
            color: rgba(255, 255, 255, 0.45);

            font-size: 15px;

            letter-spacing: 2px;
        }


        /* =====================================================
           الحركات
        ===================================================== */

        @keyframes introAppear {

            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            60% {
                opacity: 1;
                transform: scale(1.04);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }


        @keyframes titleReveal {

            0% {
                opacity: 0;
                letter-spacing: 35px;
            }

            100% {
                opacity: 1;
                letter-spacing: 18px;
            }
        }


        @keyframes subtitleAppear {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes lineExpand {

            from {
                width: 0;
            }

            to {
                width: 180px;
            }
        }


        @keyframes glowPulse {

            from {
                transform: scale(0.9);
                opacity: 0.5;
            }

            to {
                transform: scale(1.15);
                opacity: 0.9;
            }
        }


        @keyframes titleGlow {

            from {
                text-shadow:
                    0 0 10px rgba(255, 0, 0, 0.15),
                    0 0 30px rgba(120, 0, 0, 0.2);
            }

            to {
                text-shadow:
                    0 0 15px rgba(255, 0, 0, 0.3),
                    0 0 45px rgba(120, 0, 0, 0.45);
            }
        }


        /* =====================================================
           حالة إخفاء الافتتاح
        ===================================================== */

        #intro.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* =====================================================
           الهاتف
        ===================================================== */

        @media (max-width: 800px) {

            .sidebar {
                width: 220px;
                padding: 35px 20px;
            }

            .main-content {
                right: 220px;
                width: calc(100% - 220px);
            }

            .nav-item {
                font-size: 14px;
            }

            .welcome h2 {
                letter-spacing: 10px;
            }
        }


        @media (max-width: 600px) {

            .sidebar {
                width: 100%;
                height: auto;

                bottom: 0;
                top: auto;

                padding: 15px 15px;

                flex-direction: row;
                align-items: center;

                border-left: 0;
                border-top: 1px solid rgba(120, 0, 0, 0.45);

                transform: translateY(100%);
            }

            #site.show .sidebar {
                transform: translateY(0);
            }

            .logo,
            .sidebar-divider,
            .sidebar-bottom {
                display: none;
            }

            .navigation {
                width: 100%;

                flex-direction: row;

                justify-content: space-around;

                gap: 4px;
            }

            .nav-item {
                flex: 1;

                justify-content: center;

                padding: 12px 5px;

                border-right: 0;
                border-bottom: 2px solid transparent;

                font-size: 12px;
            }

            .nav-item:hover,
            .nav-item.active {
                border-right: 0;
                border-bottom-color: #8b0000;
            }

            .nav-number {
                display: none;
            }

            .main-content {
                top: 0;
                right: 0;

                width: 100%;

                height: calc(100vh - 65px);
            }

            .intro-content h1 {
                font-size: 65px;
                letter-spacing: 10px;
            }

            .intro-content p {
                font-size: 11px;
                letter-spacing: 2px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         شاشة الافتتاح
    ====================================================== -->

    <div id="intro">

        <div class="intro-glow"></div>

        <div class="intro-content">

            <div class="intro-line"></div>

            <h1>VOID</h1>

            <div class="intro-line"></div>

            <p>حين يبدأ الفراغ... تبدأ الحكاية.</p>

        </div>

    </div>



    <!-- =====================================================
         الموقع
    ====================================================== -->

    <div id="site">


        <!-- القائمة -->

        <aside class="sidebar">

            <div class="logo">
                <span>V</span>OID
            </div>


            <div class="sidebar-divider"></div>


            <nav class="navigation">

                <a href="#" class="nav-item active">
                    <span class="nav-number">01</span>
                    <span>الرئيسية</span>
                </a>

                <a href="#" class="nav-item">
                    <span class="nav-number">02</span>
                    <span>الفصول</span>
                </a>

                <a href="#" class="nav-item">
                    <span class="nav-number">03</span>
                    <span>عالم الرواية</span>
                </a>

                <a href="#" class="nav-item">
                    <span class="nav-number">04</span>
                    <span>إعدادات الموقع</span>
                </a>

            </nav>


            <div class="sidebar-bottom">

                <span>VOID</span>

                <span class="sidebar-status"></span>

            </div>

        </aside>



        <!-- المحتوى -->

        <main class="main-content">

            <div class="background-symbol">
                V
            </div>


            <section class="welcome">

                <div class="welcome-small">
                    رواية
                </div>

                <h2>
                    VOID
                </h2>

                <div class="welcome-line"></div>

                <p>
                    كل شيء يبدأ من مكان لا شيء فيه.
                </p>

            </section>

        </main>


    </div>



    <!-- =====================================================
         نظام الانتقال
    ====================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const intro = document.getElementById("intro");
            const site = document.getElementById("site");

            /*
                الترتيب:

                1. ظهور VOID
                2. بقاء شاشة الافتتاح
                3. اختفاء شاشة الافتتاح
                4. ظهور الموقع
            */

            setTimeout(function () {

                intro.classList.add("hide");

                setTimeout(function () {

                    site.classList.add("show");

                    document.body.style.overflow = "auto";

                }, 900);

            }, 4000);

        });

    </script>


</body>
</html>
